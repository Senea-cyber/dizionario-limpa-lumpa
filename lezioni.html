const STORE='limpa-lingo-duo-v1';
const $=id=>document.getElementById(id);
let state;try{state=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){state={}}
state.done=Array.isArray(state.done)?state.done:[];state.xp=Number(state.xp)||0;state.best=Number(state.best)||0;

const saved=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}};
const clear=()=>{$('screen').replaceChildren()};
function node(tag,text,cls){const el=document.createElement(tag);if(text!=null)el.textContent=text;if(cls)el.className=cls;return el}
function add(tag,text,cls){const el=node(tag,text,cls);$('screen').append(el);return el}
function btn(label,fn,cls='primary'){const b=add('button',label,cls);b.onclick=fn;return b}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stopAudio(){voiceToken++;if('speechSynthesis' in window)speechSynthesis.cancel()}
function say(lines){stopAudio();if(!('speechSynthesis' in window)){add('p','Questo browser non supporta la voce. Puoi leggere le spiegazioni.','muted');return}const tok=voiceToken;let n=0;const go=()=>{if(tok!==voiceToken||n>=lines.length)return;const u=new SpeechSynthesisUtterance(lines[n++]);u.lang='it-IT';u.rate=.82;u.pitch=1.16;u.onend=go;u.onerror=()=>{};speechSynthesis.speak(u)};go()}
function update(){const done=new Set(state.done);$('xp').textContent='⭐ '+state.xp+' XP';$('progressLabel').textContent='Lezioni '+done.size+'/'+LESSONS.length;

$('hearts').textContent='❤️'.repeat(Math.max(0,hearts))+'🩶'.repeat(5-Math.max(0,hearts))}

function home(){phase='home';hearts=5;progress(0);$('stepLabel').textContent='Percorso';layout('👩‍🏫','Lezione '+(current+1),'Prima la professoressa ti spiega le parole. Poi ti alleni con domande a scelta e guadagni XP.');btn('📖 Inizia con la professoressa',()=>teach(0));if(state.done.length===LESSONS.length)btn('🏆 Esame madrelingua',()=>startExam(),'secondary');update()}
function teach(i){phase='teach';index=i;progress((i+.5)/(LESSONS[current].length+10));$('stepLabel').textContent='👩‍🏫 Spiegazione '+(i+1)+'/'+LESSONS[current].length;
const [it,ll]=LESSONS[current][i];layout('👩‍🏫','Ripeti con me!','La professoressa ti insegna a riconoscere e pronunciare questa parola.');
const card=add('div','Italiano: '+it,'teacher');const small=node('small','In Limpa Lumpa si dice: '+ll);card.append(small);
const examples=['Ciao! Adesso impariamo una nuova parola.','In italiano: '+it+'.','In Limpa Lumpa: '+ll+'.','Ripeti lentamente: '+ll+'.','Benissimo! Ricorda la traduzione: '+it+' si dice '+ll+'.'];
const row=add('div',null,'actions');const listen=node('button','🔊 Ascolta la professoressa','secondary');listen.onclick=()=>say(examples);row.append(listen);
const next=node('button',i+1===LESSONS[current].length?'🎮 Vai agli esercizi':'Continua →','primary');next.onclick=()=>{stopAudio();if(i+1<LESSONS[current].length)teach(i+1);else startQuiz(false)};row.append(next);

}
function startQuiz(isExam){exam=isExam;phase='quiz';index=0;score=0;hearts=5;const pool=isExam?ALL_WORDS:LESSONS[current];questions=shuffle([...pool]).slice(0,isExam?30:10);showQuestion()}
function showQuestion(){if(!questions[index])return finish();progress(index/questions.length);$('stepLabel').textContent=(exam?'Esame finale':'Allenamento')+' • '+(index+1)+'/'+questions.length;update();clear();

const choices=shuffle([answer,...distractors]);selection=null;
for(const choice of choices){const b=btn(choice,()=>{if(selection!==null)return;selection=choice;const correct=choice===answer;if(correct){score++;state.xp+=5;saved();b.classList.add('good')}else{hearts--;b.classList.add('bad');[...$('screen').querySelectorAll('.choice')].find(z=>z.textContent===answer)?.classList.add('good')}update();
add('div',correct?'✅ Bravissimo! +5 XP':'💡 La risposta corretta è: '+answer,'feedback');btn(hearts<=0?'Riprova la lezione':'Continua →',()=>{if(hearts<=0){home();return}index++;showQuestion()});},'choice')}
}
function finish(){progress(1);const goal=exam?27:8;const pass=score>=goal;layout(pass?'🏆':'💪',pass?(exam?'Sei Madrelingua Limpa Lumpa!':'Lezione superata!'):'Riproviamo insieme?',score+' risposte corrette su '+questions.length+'. Servono '+goal+' risposte corrette.');
