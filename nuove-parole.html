<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Le 2.896 nuove parole Limpa Lumpa</title><style>body{font:16px system-ui;background:#f7f5ff;color:#241c38;margin:0}header{background:#6943c8;color:white;padding:25px 15px}main{max-width:850px;margin:22px auto;padding:0 14px}a{color:#6242bc}nav{display:flex;gap:16px}nav a{color:white}section{background:white;padding:20px;border-radius:18px;margin:16px 0;box-shadow:0 3px 18px #31135912}h2{margin-top:0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee}button{border:0;border-radius:10px;background:#6943c8;color:white;padding:10px 15px;cursor:pointer}input{padding:10px;border:1px solid #ddd;border-radius:10px;max-width:100%}.muted{color:#655e75}.correct{color:#087d4a}.wrong{color:#bd3c37} .quiz{background:#f4f0ff;padding:15px;border-radius:12px;margin-top:15px}table{table-layout:fixed;overflow-wrap:anywhere}</style><header><main><h1>📚 Le nuove 2.896 voci</h1><nav><a href="./">Traduttore</a><a href="./lezioni.html">Lezioni Limpa Lingo</a></nav></main></header><main><p>Questa espansione comprende forme dei verbi, plurali e vocaboli derivati. Non sono tutti concetti nuovi. Le traduzioni già esistenti non sono state sostituite.</p><section><input id="query" aria-label="Cerca una parola" placeholder="Cerca in italiano o Limpa Lumpa"> <button id="download">Esporta CSV</button><p id="count">Caricamento…</p><table><thead><tr><th>Italiano</th><th>Limpa Lumpa</th></tr></thead><tbody id="results"></tbody></table><p id="notice"></p><button id="more" hidden>Mostra altre 100 parole</button></section></main><script>
let words=[],filtered=[],limit=100;
async function init(){try{const res=await fetch('./index.html',{cache:'no-store'});const html=await res.text();const match=html.match(/const EXPANDED_WORDS=(\\{[^\\n]*\\});/);if(!match)throw Error('Elenco non trovato');words=Object.entries(JSON.parse(match[1])).sort((a,b)=>a[0].localeCompare(b[0],'it'));filtered=words;render()}catch(err){document.getElementById('count').textContent='Impossibile caricare l’elenco: '+err.message}}
function render(){const q=document.getElementById('query').value.trim().toLocaleLowerCase('it');filtered=words.filter(([it,ll])=>it.toLocaleLowerCase('it').includes(q)||ll.toLocaleLowerCase('it').includes(q));document.getElementById('count').textContent=filtered.length+' voci trovate';const tbody=document.getElementById('results');tbody.textContent='';for(const [it,ll] of filtered.slice(0,limit)){const row=document.createElement('tr');for(const cell of [it,ll]){const td=document.createElement('td');td.textContent=cell;row.append(td)}tbody.append(row)}document.getElementById('more').hidden=limit>=filtered.length;document.getElementById('notice').textContent=limit<filtered.length?'Visualizzate '+Math.min(limit,filtered.length)+' di '+filtered.length+' voci':''}
document.getElementById('query').addEventListener('input',()=>{limit=100;render()});document.getElementById('more').onclick=()=>{limit+=100;render()};document.getElementById('download').onclick=()=>{const csv='Italiano;Limpa Lumpa\\n'+filtered.map(([it,ll])=>[it,ll].map(x=>'"'+x.replaceAll('"','""')+'"').join(';')).join('\\n');const url=URL.createObjectURL(new Blob([String.fromCharCode(0xFEFF)+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='nuove-parole-limpa-lumpa.csv';a.click();URL.revokeObjectURL(url)};init();
</script></html>
